tags:
  - Contacts
summary: Create contact
operationId: postContact
description: Create new contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: Dave
          phoneNumber:
            type: string
            minLength: 10
            maxLength: 14
            example: 0805559898
          email:
            type: string
            format: email
          isFavourite:
            type: boolean
            default: false
          contactType:
            type: string
            enum: [work, home, personal]
            default: personal
            example: work
          photo:
            type: string
            format: binary
            description: Optional photo file
responses:
  '201':
    description: Successfully created a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    description: Bad request, invalid input
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
