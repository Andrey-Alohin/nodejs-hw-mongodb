tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: |
  Get a list of all contacts. This endpoint retrieves all contacts with optional pagination, sorting, and filtering.
  Supported query parameters:
    - page: Page number for pagination (optional)
    - perPage: Number of contacts per page (optional)
    - sortBy: Field to sort by (optional)
    - sortOrder: Sort order, 'asc' or 'desc' (optional)
    - type: Filter contacts by contactType (optional)
    - isFavourite: Filter contacts by favourite status (optional)
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      default: 1
      example: 1
  - in: query
    name: perPage
    required: false
    schema:
      type: integer
      default: 10
      example: 10
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
      enum: [_id, name, createdAt, updatedAt]
      default: _id
      example: name
  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
      example: asc
  - in: query
    name: type
    required: false
    schema:
      type: string
      enum: [work, home, personal]
      example: home
  - in: query
    name: isFavourite
    required: false
    schema:
      type: boolean
      enum: [true, false]
      example: true
responses:
  '200':
    description: 'Successfully retrieved contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully retrieved contacts!'
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 20
                totalPages:
                  type: integer
                  example: 2
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
